<nav class="paginator" aria-label="Pagination">
  <span class="summary">{{ firstItem() }}–{{ lastItem() }} sur {{ total() }}</span>

  <div class="pages">
    <button type="button" [disabled]="page() === 1" (click)="goTo(page() - 1)">‹ Précédent</button>

    @for (p of pages(); track $index) {
      @if (p === 0) {
        <span class="ellipsis">…</span>
      } @else {
        <button
          type="button"
          class="page"
          [class.active]="p === page()"
          [attr.aria-current]="p === page() ? 'page' : null"
          (click)="goTo(p)"
        >
          {{ p }}
        </button>
      }
    }

    <button type="button" [disabled]="page() === totalPages()" (click)="goTo(page() + 1)">
      Suivant ›
    </button>
  </div>
</nav>
